name: Quality

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Smoke test runtime imports
        run: >-
          python -c "import altair, extract_msg, folium, gdown, geobr, geopandas,
          google.oauth2.service_account, gspread, holidays, numpy, openpyxl, pandas,
          PIL, plotly, reportlab, requests, streamlit, streamlit_autorefresh,
          streamlit_folium, streamlit_gsheets, urllib3, xlrd, xlsxwriter"

      - name: Lint
        run: ruff check .

      - name: Syntax and repository guards
        run: python tests/test_sintaxe.py

      - name: Tests
        run: pytest -q
