# ═══════════════════════════════════════════════════════════════════════════════
# EXEMPLO de configuração de segredos — Painel TOTALE
#
# Como usar:
#   1. cp .streamlit/secrets.example.toml .streamlit/secrets.toml
#   2. Preencha com os valores reais.
#   3. NUNCA faça commit do secrets.toml (ele já está no .gitignore).
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# 1. USUÁRIOS DO PORTAL (obrigatório — sem isso o acesso fica bloqueado)
#
#    Gere o hash da senha com:
#        python -m components.auth "MinhaSenhaForte"
#
#    Perfis: admin | supervisor | operador | leitura
#    "bases" vazio = acesso a todas as bases.
# ───────────────────────────────────────────────────────────────────────────────

[usuarios.denisvick]
nome = "Denis Vick"
role = "admin"
bases = []
senha = "pbkdf2_sha256$260000$SUBSTITUA_PELO_SALT$SUBSTITUA_PELO_HASH"

[usuarios.exemplo_supervisor]
nome = "Supervisor Exemplo"
role = "supervisor"
bases = ["SAO PAULO", "GUARULHOS"]
senha = "pbkdf2_sha256$260000$SUBSTITUA_PELO_SALT$SUBSTITUA_PELO_HASH"

# Tempo de inatividade até a sessão expirar (minutos). Padrão: 720 (12h).
auth_expiracao_minutos = 720

# ───────────────────────────────────────────────────────────────────────────────
# 2. SERVICE ACCOUNT DO GOOGLE CLOUD (para gspread / google-api)
#    Compartilhe a planilha com o e-mail da service account (client_email).
# ───────────────────────────────────────────────────────────────────────────────

[gcp_service_account]
type = "service_account"
project_id = "seu-projeto"
private_key_id = "chave-id"
private_key = "-----BEGIN PRIVATE KEY-----\nSUA_CHAVE\n-----END PRIVATE KEY-----\n"
client_email = "painel-totale@seu-projeto.iam.gserviceaccount.com"
client_id = "000000000000000000000"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/painel-totale%40seu-projeto.iam.gserviceaccount.com"

# ───────────────────────────────────────────────────────────────────────────────
# 3. CONEXÃO st.connection("gsheets") — usada por várias páginas
# ───────────────────────────────────────────────────────────────────────────────

[connections.gsheets]
spreadsheet = "https://docs.google.com/spreadsheets/d/SEU_SPREADSHEET_ID/edit"
type = "service_account"
project_id = "seu-projeto"
private_key_id = "chave-id"
private_key = "-----BEGIN PRIVATE KEY-----\nSUA_CHAVE\n-----END PRIVATE KEY-----\n"
client_email = "painel-totale@seu-projeto.iam.gserviceaccount.com"
client_id = "000000000000000000000"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/painel-totale%40seu-projeto.iam.gserviceaccount.com"

# ───────────────────────────────────────────────────────────────────────────────
# 4. IDs DE PLANILHA / DRIVE (opcional — há padrões no código,
#    mas recomenda-se definir aqui para não alterar código)
# ───────────────────────────────────────────────────────────────────────────────

URL_ATIVOS = "https://docs.google.com/spreadsheets/d/SEU_ID_ATIVOS"
SHEET_ID_ATIVOS = "SEU_ID_ATIVOS"
SHEET_ID_PROD = "SEU_ID_PRODUCAO"
DRIVE_ID_CONS = "SEU_ID_DRIVE_CONSULTIVO"
GSHEETS_ID = "SEU_ID_ATIVOS"
